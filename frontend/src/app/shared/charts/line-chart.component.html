<div class="line-chart-wrap" *ngIf="!sinDatos; else sinDatosTpl">
  <svg
    #svgEl
    [attr.viewBox]="'0 0 ' + ancho + ' ' + alto"
    preserveAspectRatio="none"
    class="line-chart-svg"
    (mousemove)="alMoverMouse($event, svgEl)"
    (mouseleave)="alSalirMouse()">

    <!-- Cuadrícula recesiva -->
    <g class="grid">
      <line *ngFor="let linea of lineasGrid"
            [attr.x1]="margen.izquierda" [attr.x2]="ancho - margen.derecha"
            [attr.y1]="linea.y" [attr.y2]="linea.y"></line>
      <text *ngFor="let linea of lineasGrid" [attr.x]="margen.izquierda" [attr.y]="linea.y - 4">{{ linea.valor }}</text>
    </g>

    <!-- Línea vertical de foco (crosshair) -->
    <line *ngIf="indiceHover !== null"
          class="crosshair"
          [attr.x1]="posicionesX[indiceHover]" [attr.x2]="posicionesX[indiceHover]"
          [attr.y1]="margen.arriba" [attr.y2]="alto - margen.abajo"></line>

    <!-- Series -->
    <g *ngFor="let ruta of rutasPorSerie">
      <path class="serie-linea" [attr.d]="ruta.d" [attr.stroke]="ruta.colorVar"></path>
      <circle *ngFor="let p of ruta.puntos; let i = index"
              [attr.cx]="p.x" [attr.cy]="p.y"
              [attr.r]="indiceHover === i ? 4.5 : 3"
              [attr.fill]="ruta.colorVar"
              class="serie-punto"></circle>
    </g>

    <!-- Etiquetas del eje X (una sí, una no si hay muchas, para no amontonar) -->
    <g class="eje-x">
      <text *ngFor="let etiqueta of etiquetas; let i = index"
            [class.oculta]="etiquetas.length > 9 && i % saltoEtiquetas !== 0 && i !== etiquetas.length - 1"
            [attr.x]="posicionesX[i]" [attr.y]="alto - 8">{{ etiqueta }}</text>
    </g>

    <!-- Tooltip -->
    <g *ngIf="indiceHover !== null" class="tooltip-grupo" [attr.transform]="'translate(' + xTooltip + ', ' + margen.arriba + ')'">
      <rect class="tooltip-fondo" [attr.width]="anchoTooltip" [attr.height]="altoTooltip" rx="6"></rect>
      <text class="tooltip-titulo" x="10" y="16">{{ etiquetas[indiceHover] }}</text>
      <ng-container *ngFor="let ruta of rutasPorSerie; let i = index">
        <circle class="tooltip-swatch" cx="14" [attr.cy]="34 + i * 16" r="3.5" [attr.fill]="ruta.colorVar"></circle>
        <text class="tooltip-valor" x="22" [attr.y]="38 + i * 16">{{ ruta.nombre }}: {{ ruta.puntos[indiceHover].valor }}</text>
      </ng-container>
    </g>
  </svg>

  <!-- Leyenda (HTML, no SVG, para que el texto siempre use los tokens de tinta del tema) -->
  <div class="line-chart-leyenda" *ngIf="series.length > 1">
    <span class="leyenda-item" *ngFor="let serie of series">
      <span class="leyenda-swatch" [style.background]="serie.colorVar"></span>
      {{ serie.nombre }}
    </span>
  </div>
</div>

<ng-template #sinDatosTpl>
  <div class="line-chart-vacio">Sin datos suficientes en el histórico para mostrar la tendencia de este periodo.</div>
</ng-template>
